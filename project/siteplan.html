<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Burundi | Contact</title>
    <link rel="stylesheet" href="styles/travel.css">
</head>
<body>

<header>
    <h1>Contact Us</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="attractions.html">Attractions</a></li>
            <li><a href="culture.html">Culture</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <form id="contactForm" method="get" action="review.html">
        
        <label for="productSelect">Choose a Product:</label>
        <select id="productSelect" name="product_name" required>
            <option value="" disabled selected>Select a product...</option>
            <option value="rusizi">Rusizi National Park Tour</option>
            <option value="tanganyika">Lake Tanganyika Cruise</option>
            <option value="gitega">Gitega Cultural Excursion</option>
        </select>

        <fieldset>
            <legend>Product Rating</legend>
            <label><input type="radio" name="rating" value="1" required> 1</label>
            <label><input type="radio" name="rating" value="2"> 2</label>
            <label><input type="radio" name="rating" value="3"> 3</label>
            <label><input type="radio" name="rating" value="4"> 4</label>
            <label><input type="radio" name="rating" value="5"> 5</label>
        </fieldset>

        <label for="reviewDate">Date of Visit:</label>
        <input type="date" id="reviewDate" name="review_date" required>

        <fieldset>
            <legend>Features Experienced (Select at least 4)</legend>
            <label><input type="checkbox" name="features" value="guide"> Professional Guide</label>
            <label><input type="checkbox" name="features" value="transport"> Comfortable Transport</label>
            <label><input type="checkbox" name="features" value="meals"> Meals Included</label>
            <label><input type="checkbox" name="features" value="photos"> Photography Spots</label>
        </fieldset>

        <label for="userMessage">Written Review:</label>
        <textarea id="userMessage" name="user_message" rows="5" required placeholder="Share your experience..."></textarea>

        <button type="submit">Submit Review</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Benjamin Iriganje - Travel Burundi</p>
</footer>

<script src="scripts/travel.js"></script>

</body>
</html>
