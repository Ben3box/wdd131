<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - Travel Burundi</title>
    <meta name="description" content="Submit a detailed product review for gear and travel utilities.">
    <meta name="author" content="Benjamin Iriganje">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>

    <header>
        <h1>Travel Burundi</h1>
        <p>Product Review Dashboard</p>
    </header>

    <main>
        <section class="form-container">
            <h2>Share Your Experience</h2>
            <p>Your feedback helps us promote high-quality, sustainable equipment for explorers.</p>
            
            <form method="get" action="review.html">
                
                <div class="form-group">
                    <label for="product-select">Product Name <span class="required">*</span></label>
                    <select id="product-select" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                        <option value="Hiking Boots">Hiking Boots</option>
                        <option value="Trekking Pole">Trekking Pole</option>
                        <option value="Water Bottle">Water Bottle</option>
                        <option value="Backpack">Backpack</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Overall Rating <span class="required">*</span></label>
                    <div class="rating-container">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">☆</label>
                        
                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">☆</label>
                        
                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">☆</label>
                        
                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">☆</label>
                        
                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 star">☆</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="install-date">Date of Installation <span class="required">*</span></label>
                    <input type="date" id="install-date" name="installationDate" required>
                </div>

                <div class="form-group">
                    <label>Useful Features (Check all that apply)</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="feat-durability" name="features" value="durability">
                            <label for="feat-durability">High Durability</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="feat-weight" name="features" value="lightweight">
                            <label for="feat-weight">Lightweight Design</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="feat-battery" name="features" value="battery-life">
                            <label for="feat-battery">Long Battery Life</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="feat-waterproof" name="features" value="waterproofing">
                            <label for="feat-waterproof">Waterproofing</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="written-review">Written Review (Optional)</label>
                    <textarea id="written-review" name="writtenReview" rows="5" placeholder="Tell us how this product performed..."></textarea>
                </div>

                <div class="form-group">
                    <label for="user-name">Your Name (Optional)</label>
                    <input type="text" id="user-name" name="userName" placeholder="e.g., Benjamin I.">
                </div>

                <input type="submit" value="Submit Product Review" class="submit-btn">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Benjamin Iriganje, Burundi</p>
        <p id="lastModified"></p>
    </footer>

    <script src="scripts/form.js"></script>
</body>
</html>
